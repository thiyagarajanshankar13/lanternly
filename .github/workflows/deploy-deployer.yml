# Builds this app and delivers it to the deployer VM.
#
# Repository settings needed (Settings > Secrets and variables > Actions):
#   secret   DEPLOYER_VM_SSH_KEY   private key of a user on the VM who may run sudo docker
#   variable DEPLOYER_VM_HOST      the VM's address
#   variable DEPLOYER_VM_USER      that user's name (default: ubuntu)
#   variable DEPLOYER_VM_HOST_KEY  "ssh-ed25519 AAAA…" from the Set up a VM summary (recommended; without it the VM's key is accepted as presented)
# Nothing runs until DEPLOYER_VM_HOST is set.
name: Deploy the deployer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'agent/**', '**.md']
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-deployer
jobs:
  deploy:
    if: vars.DEPLOYER_VM_HOST != ''
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck && npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deliver over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOYER_VM_SSH_KEY }}
          HOST: ${{ vars.DEPLOYER_VM_HOST }}
          VM_USER: ${{ vars.DEPLOYER_VM_USER || 'ubuntu' }}
          HOST_KEY: ${{ vars.DEPLOYER_VM_HOST_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$HOST_KEY" ]; then
            printf '%s %s\n' "$HOST" "$HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOYER_VM_HOST_KEY is not set, so the key the VM presents is accepted as it is. Save the key from the Set up a VM summary as that variable."
            ssh-keyscan -T 10 -t ed25519 "$HOST" 2>/dev/null | grep " ssh-ed25519 " | grep -v "^#" | head -1 > ~/.ssh/known_hosts
            [ -s ~/.ssh/known_hosts ] || { echo "::error::Couldn't reach $HOST on port 22."; exit 1; }
          fi
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes deploy/docker-compose.yml "$VM_USER@$HOST:/tmp/deployer-compose.yml"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$VM_USER@$HOST" \
            "IMAGE='$IMAGE' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' RELEASES_TOKEN='$RELEASES_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo install -m 644 /tmp/deployer-compose.yml /opt/deployer/docker-compose.yml
          echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          sudo docker pull -q "$IMAGE"
          sudo docker logout ghcr.io >/dev/null
          cd /opt/deployer
          sudo env DEPLOYER_IMAGE="$IMAGE" docker compose up -d --remove-orphans
          for i in $(seq 1 30); do
            sudo docker exec deployer-app node -e "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null && { echo "Deployed $IMAGE"; exit 0; }
            sleep 2
          done
          echo "The deployer didn't answer. Last logs:"; sudo docker logs --tail 60 deployer-app; exit 1
          REMOTE
